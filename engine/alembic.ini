# Alembic CLI config. Run from the repository root, e.g.:
#   alembic -c engine/alembic.ini revision --autogenerate -m "add foo column"
#   alembic -c engine/alembic.ini upgrade head
# The engine itself runs `upgrade head` on startup (engine/db/migrate.py),
# so the CLI is only needed to author new revisions or inspect history.
# DATABASE_URL comes from the environment / project .env (see migrations/env.py).

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
