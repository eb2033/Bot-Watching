{% extends "base.html" %}

{% block content %}
<header class="topbar">
	<h1>Honeypot Dashboard</h1>
</header>

<main class="dashboard-grid">
	<div class="charts-column">
		<section class="panel chart-panel">
			<div class="panel-header">
				<h2>Activity volume</h2>
				<div class="chart-nav">
					<button id="volume-prev" type="button" aria-label="Previous month">&larr;</button>
					<span id="volume-month-label"></span>
					<button id="volume-next" type="button" aria-label="Next month">&rarr;</button>
				</div>
			</div>
			<div id="volume-chart"></div>
		</section>

		<section class="panel chart-panel">
			<h2>Alert activity</h2>
			<div id="activity-chart"></div>
		</section>
	</div>

	<section class="panel alerts-panel">
		<div class="panel-header">
			<h2>Alerts</h2>
			<div class="filters">
				<label>
					Severity
					<select id="severity-filter">
						<option value="">All</option>
					</select>
				</label>
				<label>
					Rule
					<select id="rule-filter">
						<option value="">All</option>
					</select>
				</label>
			</div>
		</div>
		<div class="alerts-scroll">
			<ul id="alerts-list" class="alerts-list">
				<li class="empty-row">Loading…</li>
			</ul>
		</div>
		<div class="pagination">
			<button id="prev-page" type="button">&larr; Prev</button>
			<span id="page-indicator">Page 1 of 1</span>
			<button id="next-page" type="button">Next &rarr;</button>
		</div>
	</section>
</main>
{% endblock %}
