#Local Container Stack

#Real Cowrie currently runs here right now for local attack simulation and testing. AWS EC2 deployment will be in the next implementation.
#The AWS EC2 deployment is the internet-facing production instance; this one is just for the local dev loop.

#Exposure: only Cowrie's 2222 is published on all interfaces (it's the bait). Postgres and Grafana bind to
#127.0.0.1 only - on EC2, reach Grafana through an SSH tunnel / SSM port forward
#(e.g. `ssh -L 3000:127.0.0.1:3000 ec2-user@<host>`) instead of opening 3000 in the security group.

#Images are pinned by tag + digest so every deploy runs exactly what was tested. To upgrade, bump both
#(digest: `docker buildx imagetools inspect <image>:<tag>`) and re-test locally.

networks:
  honeypot-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

services:
  db:
    build:
      context: .
      dockerfile: db.Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      GRAFANA_USER: ${GRAFANA_USER}
      GRAFANA_PASSWORD: ${GRAFANA_PASSWORD}
    command: >
      -c ssl=on
      -c ssl_cert_file=/var/lib/postgresql/certs/dbServer.crt
      -c ssl_key_file=/var/lib/postgresql/certs/dbServer.key
      -c hba_file=/etc/postgresql/config_files/pg_hba.conf
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./init-scripts:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql/data
      - ./config_files/pg_hba.conf:/etc/postgresql/config_files/pg_hba.conf:ro
    networks:
      - honeypot-net

  cowrie:
    image: cowrie/cowrie:3.0.15@sha256:fc57120d88c2bfb5817f63f6c132ce5c2969b641c2f1ac67887652b6f294148d
    restart: unless-stopped
    healthcheck:
      # Distroless image: no shell or curl, so probe the SSH port with Cowrie's own Python.
      test: ["CMD", "/cowrie/cowrie-env/bin/python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 2222), 3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      honeypot-net:
        ipv4_address: 172.28.0.10
    ports:
      - "2222:2222"
    volumes:
      - cowrie-var:/cowrie/cowrie-git/var

  engine:
    build:
      context: ../..
      dockerfile: infra/docker/engine.Dockerfile
    restart: unless-stopped
    env_file: ../../.env
    environment:
      # Built from the same credentials the db service is initialised with (infra/docker/.env),
      # so they can't drift apart. POSTGRES_PASSWORD must be URL-safe (no @ : / ? # %).
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=require
      COWRIE_LOG_PATH: /cowrie-var/log/cowrie/cowrie.json
      LISTENER_BATCH_SIZE: 5
      LISTENER_POLL_INTERVAL_SECONDS: 2
    # Healthcheck (heartbeat file freshness) is defined in engine.Dockerfile.
    depends_on:
      cowrie:
        condition: service_started
      db:
        condition: service_healthy
    volumes:
      - cowrie-var:/cowrie-var
      # GeoLite2 .mmdb files are licensed by MaxMind and kept out of the image (.dockerignore);
      # on EC2, populate this directory with geoipupdate.
      - ../../engine/enrichment/data:/app/engine/enrichment/data:ro
      - ../../scripts:/app/scripts:ro
    networks:
      - honeypot-net

  grafana:
    image: grafana/grafana:13.1.7@sha256:248cda1de5bc3e69c3fb23c5efe1292aa18399d8ece499aa88cab6fd16f78d4b
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      GRAFANA_USER: ${GRAFANA_USER}
      GRAFANA_PASSWORD: ${GRAFANA_PASSWORD}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - honeypot-net

  grafana-provision:
    image: curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
    environment:
      GRAFANA_SA_TOKEN: ${GRAFANA_SA_TOKEN}
    volumes:
      - ./grafana/dashboards:/dashboards:ro
      - ./grafana/provision-dashboard.sh:/provision-dashboard.sh:ro
    entrypoint: ["/bin/sh", "/provision-dashboard.sh"]
    depends_on:
      grafana:
        condition: service_healthy
    networks:
      - honeypot-net

volumes:
  pgdata:
  cowrie-var:
  grafana-storage:
