# TYPE      DATABASE    USER        ADDRESS         METHOD
# Unix socket inside the container only (initdb scripts, pg_isready healthcheck).
local       all         all                         trust
# honeypot-net (docker-compose.yml) only. Host connections through the
# 127.0.0.1-bound published port arrive via the bridge gateway (172.28.0.1),
# which is inside this range. Everything else is rejected by default.
hostssl     all         all         172.28.0.0/16   scram-sha-256
